name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # se detiene en la etapa de tests, no llega a final
          load: true            # deja la imagen en el Docker local, para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con cobertura
        run: |
          mkdir -p TestResults
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Reporte de cobertura
        if: ${{ !cancelled() }}   # también cuando los tests fallaron
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" --entrypoint go backend-test:ci \
            tool cover -func=/out/coverage.out > TestResults/cobertura.txt
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" --entrypoint go backend-test:ci \
            tool cover -html=/out/coverage.out -o /out/coverage.html
          {
            echo "## Cobertura del backend (internal/service)"
            echo ""
            echo "Total: **$(tail -n 1 TestResults/cobertura.txt | awk '{print $NF}')** de sentencias (Go no mide cobertura de rama)."
            echo ""
            echo '```'
            cat TestResults/cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de cobertura
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-backend
          path: |
            TestResults/coverage.html
            TestResults/coverage.out
            TestResults/cobertura.txt

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test          # se detiene en la etapa de tests, no llega a nginx
          load: true            # deja la imagen en el Docker local, para poder correrla
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          mkdir -p frontend-coverage
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}   # también cuando los tests fallaron
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('## Cobertura del frontend (src/utils y src/api/client.js)');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # El &ref= es obligatorio: sin él, el hook despliega la punta de la rama
      # y no el commit que acabamos de verificar. El hook ya trae ?key=..., por eso &.
      - name: Disparar deploy en Render (backend y front) del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://turnero-api-qa-y8o0.onrender.com
          URL_FRONT: https://turnero-front-qa-j4zw.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            # --max-time en cada curl: un servicio despertando acepta la conexión
            # y no contesta; sin tope el job se cuelga hasta el límite del runner.
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/profesionales" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/profesionales" > /dev/null; then
              echo "QA responde (API + base + front con proxy)"; exit 0
            fi
            sleep 20
          done
          echo "QA no respondió a tiempo"; exit 1
